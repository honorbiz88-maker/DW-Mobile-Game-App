<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DelWin Mobile: Roadside Tire Rescue</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Top HUD -->
    <header class="top-hud">
      <div class="brand-badge">
        <span class="brand-title">DELWIN MOBILE</span>
        <span class="brand-sub">ROADSIDE TIRE RESCUE</span>
      </div>
      <div class="hud-stats">
        <div class="stat-pill cash"><span class="icon">💵</span><span id="hud-cash">$350</span></div>
        <div class="stat-pill rep"><span class="icon">⭐</span><span id="hud-rep">100</span></div>
        <div class="stat-pill streak"><span class="icon">🔥</span><span id="hud-streak">0</span></div>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="nav-btn active" data-tab="dispatch">🚨 Dispatch</button>
      <button class="nav-btn" data-tab="garage">🚛 Rig & Cargo</button>
      <button class="nav-btn" data-tab="depot">🏪 Supply Depot</button>
    </nav>

    <!-- TAB 1: DISPATCH BOARD -->
    <main id="tab-dispatch" class="tab-view active">
      <div class="section-header">
        <h2>Live Highway Dispatch</h2>
        <button id="btn-refresh-board" class="btn-small">↻ Refresh Calls</button>
      </div>

      <!-- Cargo Quick Bar -->
      <div class="cargo-strip" id="dispatch-cargo-strip"></div>

      <!-- Active Call List -->
      <div id="job-list" class="job-list"></div>

      <!-- ACTIVE REPAIR BAY OVERLAY -->
      <section id="repair-bay" class="repair-bay hidden">
        <div class="bay-header">
          <div>
            <span id="bay-condition-badge" class="cond-badge clear">☀️ CLEAR DAY</span>
            <h3 id="bay-vehicle-title">2023 Sedan — I-285 Perimeter</h3>
            <p id="bay-issue-desc" class="muted">Diagnosis needed</p>
          </div>
          <div class="bay-timer-box">
            <span class="timer-label">RESPONSE</span>
            <span id="bay-timer" class="timer-val">00:45</span>
          </div>
        </div>

        <!-- Road Scene Visual + Night Lighting / Rain Effects -->
        <div id="road-stage" class="road-stage">
          <div id="weather-overlay" class="weather-overlay"></div>
          <div id="darkness-overlay" class="darkness-overlay hidden"></div>

          <!-- Top Scene Controls -->
          <div class="scene-controls">
            <button id="btn-floodlights" class="ctrl-chip">🔦 LED Floodlights: OFF</button>
            <button id="btn-cones" class="ctrl-chip">⚠️ Place Cones</button>
            <button id="btn-emergency-drop" class="ctrl-chip danger">🚁 Emergency Tire Drop ($95)</button>
          </div>

          <!-- Vehicle & Wheel Hub -->
          <div class="vehicle-arena">
            <div id="vehicle-visual" class="vehicle-visual"></div>
            <div class="wheel-hub-wrapper">
              <div id="wheel-hub" class="wheel-hub">
                <div id="tire-ring" class="tire-ring damaged">
                  <div id="rim-center" class="rim-center">
                    <!-- 5 Lugs positioned radially -->
                    <button class="lug-node" data-lug="0" style="top: 10%; left: 50%;">1</button>
                    <button class="lug-node" data-lug="1" style="top: 38%; left: 88%;">2</button>
                    <button class="lug-node" data-lug="2" style="top: 84%; left: 74%;">3</button>
                    <button class="lug-node" data-lug="3" style="top: 84%; left: 26%;">4</button>
                    <button class="lug-node" data-lug="4" style="top: 38%; left: 12%;">5</button>
                    <div class="hub-cap">DW</div>
                  </div>
                </div>
              </div>
              <div id="floating-feedback" class="floating-feedback"></div>
            </div>
          </div>

          <!-- Step Checklist & PSI Gauge -->
          <div class="status-readout">
            <div class="step-tracker" id="step-tracker"></div>
            <div class="psi-bar-wrap">
              <span>PSI: <strong id="psi-current">12</strong> / <strong id="psi-target">35</strong></span>
              <div class="psi-track"><div id="psi-fill" class="psi-fill" style="width: 34%;"></div></div>
            </div>
          </div>
        </div>

        <!-- Tool Tray -->
        <div class="tool-tray" id="tool-tray">
          <button class="tool-btn" data-tool="jack">🏗️ Hydraulic Jack</button>
          <button class="tool-btn" data-tool="lockkey">🔑 Lock Key Socket</button>
          <button class="tool-btn" data-tool="impact">🔫 Impact Wrench</button>
          <button class="tool-btn" data-tool="plug">🩹 Plug Kit</button>
          <button class="tool-btn" data-tool="newtire">🛞 Mount Spare</button>
          <button class="tool-btn" data-tool="inflator">💨 Air Inflator</button>
          <button class="tool-btn" data-tool="torque">🔧 Torque Wrench</button>
          <button class="tool-btn" data-tool="tpms">📡 TPMS Reset</button>
        </div>

        <!-- Final Jack Drop Action -->
        <div class="bay-footer">
          <button id="btn-abort-job" class="btn-secondary">Abort Call</button>
          <button id="btn-lower-jack" class="btn-finish hidden">⬇️ LOWER JACK & STOW CONES</button>
        </div>
      </section>
    </main>

    <!-- TAB 2: GARAGE & RIG UPGRADES -->
    <main id="tab-garage" class="tab-view">
      <div class="section-header">
        <h2>Fleet Rig & Cargo Capacity</h2>
      </div>
      <div id="rig-showcase" class="card"></div>
      <div class="section-header" style="margin-top: 14px;">
        <h2>Service Tool Tiers</h2>
      </div>
      <div id="tool-upgrades" class="grid-list"></div>
    </main>

    <!-- TAB 3: SUPPLY DEPOT -->
    <main id="tab-depot" class="tab-view">
      <div class="section-header">
        <h2>DelWin Supply Depot</h2>
        <span id="depot-cap-badge" class="badge">Cargo: 0/0</span>
      </div>
      <div id="depot-items" class="grid-list"></div>
    </main>

    <!-- Job Summary Modal -->
    <div id="summary-modal" class="modal hidden">
      <div class="modal-card">
        <h2 id="sum-title">Rescue Complete!</h2>
        <div id="sum-breakdown" class="sum-breakdown"></div>
        <button id="btn-close-summary" class="btn-primary">Back to Dispatch</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
